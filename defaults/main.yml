---
##############################
# Docker options
##############################

# @var docker__channel:description: Docker repository channel to use (e.g. stable, test, nightly).
# @end
docker__channel: stable

# @var docker__version:description: >
# Pin a specific Docker version. Leave empty to install the latest available.
# Example: "5:24.0.7-1~debian.12~bookworm"
# @end
docker__version: ""

# @var docker__state:description: >
# Desired package state:
# - 'present' to install
# - 'absent' to uninstall
# @end
docker__state: "present"

# @var docker__registries:description: List of docker registries to configure.
# @var docker__registries:example: >
# docker__registries:
#  - registry_url: "https://index.docker.io/v1/"
#    username: "your_docker_hub_username"
#    password: "your_docker_hub_password"
#    email: "your_docker_hub@emailaddress.com"
#    reauthorize: false
#    config_path: "$HOME/.docker/config.json"
#    state: "present"
# @end
docker__registries: []

# @var docker__default_daemon_json:description: >
# Default Docker daemon configuration (dict).
# Merged with docker__daemon_json and rendered as /etc/docker/daemon.json.
# @end
docker__default_daemon_json:
  log-driver: "json-file"
  log-opts:
    max-size: "10m"
    max-file: "5"
    tag: "{{ '{{.ImageName}}|{{.Name}}' }}"

# @var docker__daemon_json:description: >
# Custom Docker daemon configuration (dict).
# Merged on top of docker__default_daemon_json, overriding matching keys.
# @end
docker__daemon_json: {}

# @var docker__package_dependencies:description: List of APT packages required before installing Docker.
# @end
docker__package_dependencies:
  - "ca-certificates"
  - "curl"
  - "gnupg"

# @var docker__packages:description: List of Docker APT packages to install.
# @end
docker__packages:
  - "docker-ce"
  - "docker-ce-cli"
  - "containerd.io"
  - "docker-compose-plugin"
  - "docker-buildx-plugin"

# @var docker__apt_key:description: Path to store Docker's GPG signing key.
# @end
docker__apt_key: "/etc/apt/keyrings/docker.asc"

# @var docker__apt_key_url:description: URL to download Docker's GPG signing key.
# @end
docker__apt_key_url: "https://download.docker.com/linux/debian/gpg"

# @var docker__apt_repository:description: >
# Docker APT repository definition in DEB822 format.
# Written to /etc/apt/sources.list.d/docker.sources.
# @end
docker__apt_repository: |
  Types: deb
  URIs: https://download.docker.com/linux/debian
  Suites: {{ ansible_facts['distribution_release'] }}
  Components: {{ docker__channel }}
  Signed-By: {{ docker__apt_key }}
