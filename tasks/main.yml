---
# tasks file for docker

- name: FAIL; if not Debian
  ansible.builtin.fail:
    msg: "This role currently only support Debian"
  when: ansible_facts['distribution'] != "Debian"

- name: Disable pinned Docker version
  ansible.builtin.file:
    dest: "/etc/apt/preferences.d/docker.pref"
    state: "absent"
  when: docker__version | length == 0

- name: Enable pinned Docker version
  ansible.builtin.template:
    src: "etc/apt/preferences.d/docker.pref.j2"
    dest: "/etc/apt/preferences.d/docker.pref"
    owner: "root"
    group: "root"
    mode: "0644"
  when: docker__version | length > 0

- name: Install Docker's dependencies
  ansible.builtin.apt:
    name: "{{ docker__package_dependencies }}"
    state: present

- name: Add Docker's repository
  block:
    - name: Ensure /etc/apt/keyrings directory exists
      ansible.builtin.file:
        path: "/etc/apt/keyrings"
        state: directory
        mode: "0755"

    - name: Add Docker's public GPG key
      ansible.builtin.get_url:
        url: "{{ docker__apt_key_url }}"
        dest: "{{ docker__apt_key }}"
        mode: "0644"

    - name: Configure Docker's upstream APT repository
      ansible.builtin.copy:
        content: "{{ docker__apt_repository }}"
        dest: "/etc/apt/sources.list.d/docker.sources"
        owner: "root"
        group: "root"
        mode: "0644"
      notify: ["Update apt cache"]

- name: Flush handlers to update apt cache
  ansible.builtin.meta: flush_handlers

- name: Install Docker
  ansible.builtin.apt:
    name: "{{ docker__packages }}"
    state: "{{ docker__state }}"

- name: Start Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  when: docker__state != "absent"

- name: Configure Docker daemon options (json)
  ansible.builtin.template:
    src: "etc/docker/daemon.json.j2"
    dest: "/etc/docker/daemon.json"
    owner: "root"
    group: "root"
    mode: "0644"
  when: docker__state != "absent" and (docker__default_daemon_json | d({}) or docker__daemon_json | d({}))
  notify: ["Restart Docker"]

- name: Manage Docker registry login credentials
  community.docker.docker_login:
    registry_url: "{{ item.registry_url | d(omit) }}"
    username: "{{ item.username }}"
    password: "{{ item.password }}"
    email: "{{ item.email | d(omit) }}"
    reauthorize: "{{ item.reauthorize | d(omit) }}"
    config_path: "{{ item.config_path | d((ansible_facts['env']['PWD'] | d('/root')) + '/.docker/config.json') }}"
    state: "{{ item.state | d('present') }}"
  loop: "{{ docker__registries }}"
  when: docker__state != "absent" and item.username | d() and item.password | d()
